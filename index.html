<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLI // PURGA — Sovereign Rumination Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #080808;
            color: #e5e5e5;
        }
        textarea {
            caret-color: #e5e5e5;
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#080808] text-[#e5e5e5] min-h-screen flex flex-col antialiased selection:bg-neutral-800 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home'); // home, dump, fact, burn
            
            // Module 1: Blind Dump State
            const [dumpText, setDumpText] = React.useState('');
            const [isDestroyed, setIsDestroyed] = React.useState(false);

            // Module 2: Fact Test State
            const [factInput, setFactInput] = React.useState('');
            const [factSubmitted, setFactSubmitted] = React.useState(false);

            // Module 3: Somatic Burn Timer State
            const [timer, setTimer] = React.useState(120);
            const [isRunning, setIsRunning] = React.useState(false);

            React.useEffect(() => {
                let interval;
                if (isRunning && timer > 0) {
                    interval = setInterval(() => setTimer(t => t - 1), 1000);
                } else if (timer === 0) {
                    setIsRunning(false);
                }
                return () => clearInterval(interval);
            }, [isRunning, timer]);

            return (
                <div className="max-w-xl mx-auto px-6 py-12 flex flex-col min-h-screen justify-between">
                    {/* Header */}
                    <header className="border-b border-neutral-800 pb-6 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold tracking-widest text-neutral-100">KLI // PURGA</h1>
                            <p className="text-xs text-neutral-500 tracking-wider mt-1">Sovereign Rumination Engine [App 01]</p>
                        </div>
                        <button 
                            onClick={() => { setView('home'); setIsDestroyed(false); setFactSubmitted(false); setIsRunning(false); setTimer(120); }}
                            className="text-xs tracking-widest uppercase border border-neutral-800 px-3 py-1.5 hover:border-neutral-600 transition-colors text-neutral-400"
                        >
                            Centro
                        </button>
                    </header>

                    {/* Main Content */}
                    <main className="my-auto py-8">
                        {view === 'home' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="space-y-3">
                                    <h2 className="text-lg font-medium text-neutral-200">Corte de Bucle y Descarga Forzosa.</h2>
                                    <p className="text-sm text-neutral-400 leading-relaxed">
                                        Herramienta de primeros auxilios mentales. Cuando la rumiación colapsa el sistema, no necesitas reflexionar; necesitas vaciar el ruido, anclarte al hecho real y quemar la estática.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 gap-4 pt-4">
                                    <button 
                                        onClick={() => { setDumpText(''); setIsDestroyed(false); setView('dump'); }}
                                        className="text-left border border-neutral-800 p-5 hover:border-neutral-500 transition-all group bg-neutral-950"
                                    >
                                        <div className="text-xs text-neutral-500 tracking-wider mb-1">PROTOCOLO 01</div>
                                        <div className="text-sm font-medium text-neutral-200 group-hover:text-white">Escritura Ciega (Vaciado Absoluto)</div>
                                        <div className="text-xs text-neutral-500 mt-2">Vuelca el bucle mental sin filtros y destruye el rastro.</div>
                                    </button>

                                    <button 
                                        onClick={() => { setFactInput(''); setFactSubmitted(false); setView('fact'); }}
                                        className="text-left border border-neutral-800 p-5 hover:border-neutral-500 transition-all group bg-neutral-950"
                                    >
                                        <div className="text-xs text-neutral-500 tracking-wider mb-1">PROTOCOLO 02</div>
                                        <div className="text-sm font-medium text-neutral-200 group-hover:text-white">El Test del Hecho Puro</div>
                                        <div className="text-xs text-neutral-500 mt-2">Corta la especulación abstracta reduciéndola a la materia real.</div>
                                    </button>

                                    <button 
                                        onClick={() => { setTimer(120); setIsRunning(false); setView('burn'); }}
                                        className="text-left border border-neutral-800 p-5 hover:border-neutral-500 transition-all group bg-neutral-950"
                                    >
                                        <div className="text-xs text-neutral-500 tracking-wider mb-1">PROTOCOLO 03</div>
                                        <div className="text-sm font-medium text-neutral-200 group-hover:text-white">Sostener la Carga (Combustión)</div>
                                        <div className="text-xs text-neutral-500 mt-2">Expandir conscientemente la incomodidad hasta su colapso.</div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'dump' && (
                            <div className="space-y-6">
                                <div>
                                    <span className="text-xs text-neutral-500 tracking-widest uppercase">Protocolo 01 // Escritura Ciega</span>
                                    <h3 className="text-base font-medium text-neutral-200 mt-1">Saca todo el ruido de la cabeza</h3>
                                    <p className="text-xs text-neutral-400 mt-1">Escribe rápido, sin cuidar la forma ni la moral. Al pulsar quemar, se borra para siempre de la memoria.</p>
                                </div>

                                {!isDestroyed ? (
                                    <div className="space-y-4">
                                        <textarea 
                                            rows="9"
                                            value={dumpText}
                                            onChange={(e) => setDumpText(e.target.value)}
                                            placeholder="Escribe el bucle mental sin parar..."
                                            className="w-full bg-neutral-950 border border-neutral-800 p-4 text-xs text-neutral-200 focus:outline-none focus:border-neutral-600 resize-none font-mono"
                                        />
                                        <button 
                                            onClick={() => { setDumpText(''); setIsDestroyed(true); }}
                                            disabled={!dumpText.trim()}
                                            className="w-full border border-neutral-700 bg-neutral-900 text-neutral-200 py-3 text-xs tracking-widest uppercase hover:bg-neutral-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            Quemar / Destruir Datos
                                        </button>
                                    </div>
                                ) : (
                                    <div className="border border-neutral-800 bg-neutral-950 p-8 text-center space-y-4 animate-fadeIn">
                                        <div className="text-xs uppercase tracking-widest text-neutral-400">Vasija Limpia</div>
                                        <p className="text-xs text-neutral-500">El texto ha sido incinerado digitalmente. No queda rastro.</p>
                                        <button 
                                            onClick={() => setIsDestroyed(false)}
                                            className="border border-neutral-800 text-neutral-300 px-4 py-2 text-xs uppercase tracking-widest hover:border-neutral-600 transition-colors"
                                        >
                                            Nueva Descarga
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'fact' && (
                            <div className="space-y-6">
                                <div>
                                    <span className="text-xs text-neutral-500 tracking-widest uppercase">Protocolo 02 // El Hecho Puro</span>
                                    <h3 className="text-base font-medium text-neutral-200 mt-1">Separa el drama de la realidad física</h3>
                                    <p className="text-xs text-neutral-400 mt-1">¿Cuál es el único dato matemático y físico indiscutible que está ocurriendo ahora mismo?</p>
                                </div>

                                {!factSubmitted ? (
                                    <div className="space-y-4">
                                        <textarea 
                                            rows="4"
                                            value={factInput}
                                            onChange={(e) => setFactInput(e.target.value)}
                                            placeholder="Ej: Estoy sentado, mis manos están quietas, no hay ninguna amenaza real presente..."
                                            className="w-full bg-neutral-950 border border-neutral-800 p-4 text-xs text-neutral-200 focus:outline-none focus:border-neutral-600 resize-none"
                                        />
                                        <button 
                                            onClick={() => setFactSubmitted(true)}
                                            disabled={!factInput.trim()}
                                            className="w-full border border-neutral-700 bg-neutral-900 text-neutral-200 py-3 text-xs tracking-widest uppercase hover:bg-neutral-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            Validar Hecho Físico
                                        </button>
                                    </div>
                                ) : (
                                    <div className="border border-neutral-800 bg-neutral-950 p-6 space-y-4 animate-fadeIn">
                                        <div className="text-[10px] uppercase tracking-widest text-neutral-500">Conclusión de Materia</div>
                                        <p className="text-xs text-neutral-200 leading-relaxed italic">"{factInput}"</p>
                                        <p className="text-xs text-neutral-400 pt-2 border-t border-neutral-900">
                                            Todo lo demás es estática mental, especulación del ego y películas del pasado. El resto no existe en la materia.
                                        </p>
                                        <button 
                                            onClick={() => { setFactInput(''); setFactSubmitted(false); }}
                                            className="w-full border border-neutral-800 text-neutral-300 py-2.5 text-xs uppercase tracking-widest hover:border-neutral-600 transition-colors mt-4"
                                        >
                                            Reiniciar Test
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'burn' && (
                            <div className="space-y-6 text-center py-6">
                                <div>
                                    <span className="text-xs text-neutral-500 tracking-widest uppercase">Protocolo 03 // Sostener la Carga</span>
                                    <h3 className="text-base font-medium text-neutral-200 mt-1">Expansión hasta el colapso</h3>
                                    <p className="text-xs text-neutral-400 mt-2 max-w-xs mx-auto">
                                        Lleva la atención al nudo físico. Hazlo grande, grande, grande. No huyas ni lo distraigas. Deja que se consuma solo.
                                    </p>
                                </div>

                                <div className="py-10">
                                    <div className="text-4xl font-light tracking-widest text-neutral-200">
                                        {Math.floor(timer / 60)}:{String(timer % 60).padStart(2, '0')}
                                    </div>
                                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-2">
                                        {isRunning ? 'Sosteniendo la densidad...' : 'Pausa Operativa'}
                                    </div>
                                </div>

                                <div className="flex justify-center gap-4">
                                    {!isRunning ? (
                                        <button 
                                            onClick={() => setIsRunning(true)}
                                            className="border border-neutral-700 bg-neutral-900 text-neutral-200 px-6 py-2.5 text-xs tracking-widest uppercase hover:bg-neutral-800 transition-colors"
                                        >
                                            Iniciar Sostén
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => setIsRunning(false)}
                                            className="border border-neutral-800 bg-neutral-950 text-neutral-400 px-6 py-2.5 text-xs tracking-widest uppercase hover:border-neutral-600 transition-colors"
                                        >
                                            Pausar
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-neutral-900 pt-6 text-center text-[10px] text-neutral-600 tracking-widest uppercase">
                        KLI // PURGA — Cero Adornos. Cero Memoria.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
